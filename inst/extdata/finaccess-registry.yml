# knbsdata FinAccess file catalogue
#
# The FinAccess household surveys (2006-2024) and the FinAccess MSE Tracker
# Survey, published by the Central Bank of Kenya, KNBS and FSD Kenya on the
# FinAccess portal (audit F-40). The portal is a static Google Sites page whose
# downloads are Google Drive files, so there is no catalogue to query: every
# file below was opened, named and measured by hand on the date in `checked`.
#
# The download layer holds each file to this record. Before a transfer it asks
# Drive for the file's first bytes, which carry its served name and total
# size; a file that no longer matches is refused before anything large moves.
# After the transfer the size is checked again, and the SHA-256 must equal the
# one recorded here, taken from a full download of every file on `checked`.
#
# Corrections to the portal's own labels are deliberate and noted per file:
# the MSE Wave II links are swapped (the "SPSS" link serves the Stata file and
# the reverse), the MSE Wave I "STATA" link serves the SPSS file, and the 2006
# and 2009 "Questionnaire" archives hold the survey data as well. The 2019
# heading on the portal lists no files.
#
# Fields per file: `file_id` (the package's own, stable), `survey`
# (household | mse_tracker), `year`, `wave`, `content` (data | questionnaire |
# manual | report), `format` (stata | spss | excel | pdf; for an archive, the
# format of the data inside), `file_name`, `size_bytes` and `sha256` as Drive
# serves them, `contains` for an archive's entries, `drive_id`, `portal_label`
# verbatim, `notes`, and `title` where the generated one would not tell two
# files apart. A file reachable only through a registration step has
# `access: registration` and an `access_url` instead of a `drive_id`; the
# package lists it and never fetches it.

schema_version: 1
source_id: finaccess
portal: https://finaccess.knbs.or.ke/reports-and-datasets
checked: 2026-10-08
producer: Central Bank of Kenya, Kenya National Bureau of Statistics and FSD Kenya
licence: Not stated by the source
terms: >-
  The FinAccess portal states no licence. Its disclaimer says the Central
  Bank of Kenya, KNBS and FSD Kenya make no claims, promises or guarantees
  about the accuracy, completeness or adequacy of the material. FSD Kenya's
  terms for the 2013 survey on Harvard Dataverse restrict the data to
  statistical and scientific research, forbid redistributing or selling it
  without FSD Kenya's written agreement, rule out investigating specific
  individuals or organisations, and require publications to cite the
  source. Reuse terms must not be assumed; ask the producers before
  redistributing.

surveys:
  household: FinAccess Household Survey
  mse_tracker: FinAccess MSE Tracker Survey

