    workbook_id: na
    sheet: Table 2.4
    anchor: "Table 2.4"
    title: "Gross Domestic Product by Activity, 2015 - 2024 (constant 2016 prices)"
    item_column: industry
    unit: KSh million, constant 2016 prices
    hierarchy:
      sums: true
      rounding: 1
      parents:
        - parent: GDP at market prices
          components: [All industries at basic prices, Taxes less subsidies on products]
        - parent: All industries at basic prices
          components: *industries
        - *agriculture
        - *manufacturing
        - *transport
        - *ict
        - *finance
        - *education
    checks:
      through: 2024
      pins:
        - item: GDP at market prices
          period: 2016
          value: 7594064
        - item: Agriculture, forestry and fishing
          period: 2016
          value: 1521433

  - table_id: "2.5"
    workbook_id: na
    sheet: Table 2.5
    anchor: "Table 2.5"
    title: "Growth of Gross Domestic Product by Activity at Constant 2016 Prices, 2015 - 2024"
    item_column: industry
    unit: per cent, annual growth at constant 2016 prices
    hierarchy:
      # Growth rates do not add; the structure is kept, the sums are not
      # checked.
      sums: false
      parents:
        - parent: GDP at market prices
          components: [All industries at basic prices, Taxes less subsidies on products]
        - parent: All industries at basic prices
          components: *industries
        - *agriculture
        - *manufacturing
        - *transport
        - *ict
        - *finance
        - parent: Education
          components:
            - Primary education
            - General Secondary Education
            - Higher and Other Education
    checks:
      through: 2024
      pins:
        - item: GDP at market prices
          period: 2016
          value: 4.2

  - table_id: "2.6a"
    workbook_id: na
    sheet: Table 2.6 a,b,c,d
    anchor: "Table 2.6(a)"
