# knbsdata Statistical Abstract extraction registry
#
# One entry per curated table of the Statistical Abstract's chapter workbooks
# (audit F-35, F-36). Nothing here is guessed at run time: each entry records
# the sheet, the title anchor, the section labels (where the sheet has them),
# the unit as printed on the sheet, and pinned reference values read by hand
# from the workbook at curation time. The extraction engine verifies all of
# it on every read - a workbook whose layout or figures have drifted is
# refused with a classed error, never silently re-interpreted.
#
# Curated so far: Chapter 2 (National Accounts) of the 2025 edition, tables
# 2.1-2.9. The legacy annex sheets (Tables 30-35, the pre-revision 2012-2016
# series) and the other seventeen chapters are candidates for later
# curation; the registry is the extension point.
#
# A table whose rows mix totals with their parts carries a `hierarchy`: each
# `parents` entry names a row and the rows it is made of, with `subtract`
# marking parts that enter negatively (imports). The engine checks that every
# named row exists and, where `sums` is true, that the parts add up to their
# parent in every year, within what rounding to the printed precision
# (`rounding`) can explain: (parts + 1) / 2 units. Growth-rate tables keep the
# structure with `sums: false`. Rows outside every entry - headline totals
# and memo items such as "All industries excl. agriculture and forestry" -
# have no parent. The accounts tables (2.1, 2.8, 2.9) are linked by
# accounting identities rather than parts and totals, and carry none.

schema_version: 1
edition: "2025"

workbooks:
  - workbook_id: na
    chapter: "Chapter 2: National Accounts"
    publication_id: "16372"
    file_name: NA-Statistical-Abstract_2025-1.xlsx
    index_page: https://www.knbs.or.ke/reports/2025-statistical-abstract/

tables:
  - table_id: "2.1"
    workbook_id: na
    sheet: Table 2.1
    anchor: "Table 2.1"
    title: "Annual Production Accounts by Industry, 2015 - 2024"
    group_column: industry
    item_column: measure
    groups:
      - Agriculture, forestry and fishing
      - Mining and quarrying
      - Manufacturing
      - Electricity and water
      - Construction
      - Wholesale and retail trade, repair of motor vehicle
      - Transport and storage
      - Accommodation and food service activities
      - Information and communication
      - Financial and insurance activities
      - Real estate
      - Professional, scientific and technical activities
      - Administrative and support service activities
      - Public administration and defence
      - Education
      - Health and social work
      - Other service activities
      - "Less: Financial services indirectly measured"
      - All industries at basic prices
      - Total economy
    unit: KSh million, current prices
    checks:
      through: 2024
      pins:
        - group: Total economy
          item: GDP at market prices
          period: 2016
          value: 7594064
        - group: Agriculture, forestry and fishing
          item: Output at basic prices
          period: 2015
          value: 1648743

  - table_id: "2.2"
    workbook_id: na
    sheet: Table 2.2
    anchor: "Table 2.2"
    title: "Gross Domestic Product by Activity, 2015 - 2024"
    item_column: industry
    unit: KSh million, current prices
    hierarchy:
      sums: true
      rounding: 1
      parents:
        - parent: GDP at market prices
          components: [All industries, Taxes less subsidies on products]
        - parent: All industries
          components: &industries
            - Agriculture, forestry and fishing
            - Mining and quarrying
            - Manufacturing
            - Electricity supply
            - Water supply; sewerage, waste management
            - Construction
            - Wholesale and retail trade, repairs
            - Transport and storage
            - Accommodation and food service activities
            - Information communication technology
            - Financial and insurance activities
            - Real estate
            - Professional, scientific and technical activities
            - Administrative and support service activities
            - Public administration and defence
            - Education
            - Human health and social work activities
            - Arts, entertainment and recreation
            - Other service activities
            - Activities of households as employers;
            - "Less: Financial intermediation services indirectly measured"
        - &agriculture
          parent: Agriculture, forestry and fishing
          components:
            - Growing of crops
            - Animal production
            - Support activities to agriculture
            - Forestry & logging
            - Fishing & aquaculture
        - &manufacturing
          parent: Manufacturing
          components:
            - Manufacture of food, beverages and tobacco
            - All other manufacturing
        - &transport
          parent: Transport and storage
          components:
            - Land transport
            - Air transport including support services
            - All other transport including postal and courier activities
        - &ict
          parent: Information communication technology
          components:
            - Telecommunications
            - Publishing, broadcasting, other IT and information activities
        - &finance
          parent: Financial and insurance activities
          components: [Financial activities, Insurance activities]
        - &education
          parent: Education
          components:
            - Pre-primary and Primary education
            - General sec education
            - Higher and other education
    checks:
      through: 2024
      pins:
        - item: Agriculture, forestry and fishing
          period: 2015
          value: 1340350
        - item: GDP at market prices
          period: 2016
          value: 7594064

  - table_id: "2.3"
    workbook_id: na
    sheet: Table 2.3
    anchor: "Table 2.3"
    title: "Contribution to Gross Domestic Product by Activity, 2015 - 2024"
    item_column: industry
    unit: per cent of GDP
    hierarchy:
      sums: true
      rounding: 0.1
      parents:
        - parent: GDP at market prices
          components: [All industries at basic prices, Taxes less subsidies on products]
        - parent: All industries at basic prices
          components: *industries
        - *agriculture
        - *manufacturing
        - *transport
        - *ict
        - *finance
        - parent: Education
          components:
            - Primary education
            - General sec education
            - Higher and other education
    checks:
      through: 2024
      pins:
        - item: GDP at market prices
          period: 2016
          value: 100
        - item: Agriculture, forestry and fishing
          period: 2020
          value: 22.7

