    pins:
      - {geo_code: "01", column: "2013", value: 206170}
      - {geo_code: "47", column: "2017", value: 1492323}
      - {geo_code: "00", column: "2017", value: 7524710}
    title: "Gross County Product, 2013-2017, current prices"
    anchor: "Table 4: Gross County Product, 2013 - 2017"
    pages: [29, 30]
    measure: gcp
    prices: current
    unit: KSh million
    columns: ["2013", "2014", "2015", "2016", "2017"]
  - table_id: gcp-2019-share
    report_id: gcp-2019
    printed: "Table 5"
    pins:
      - {geo_code: "01", column: "2013", value: 4.8}
      - {geo_code: "47", column: "average", value: 21.7}
    title: "County share of GCP, 2013-2017"
    anchor: "Table 5: County Share of GCP, 2013 - 2017"
    pages: [31, 32]
    measure: gva_share
    unit: percent
