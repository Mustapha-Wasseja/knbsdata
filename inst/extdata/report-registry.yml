# knbsdata report table registry
#
# One entry per curated table of a KNBS report published as PDF (audit
# F-46). The reports are read from the KNBS publications library, as the
# Statistical Abstract workbooks are; nothing is bundled. Nothing about a
# table is guessed at run time: each entry records the title it is found by,
# the pages it is expected on, its columns in order, the unit printed with
# it, and figures read by hand from the report at curation time. The
# extraction engine (R/pdf-extract.R) verifies all of it on every read - the
# 47 counties and the total present exactly once, the counties adding up to
# the total within what rounding can explain, every pinned figure unchanged -
# and refuses a table that no longer matches.
#
# Report keys: report_id, series, edition, title, publication_id (the KNBS
# media library id), file_name, sha256 and size at curation, landing_page.
#
# Table keys:
#   table_id         stable id, "<report>-<what>"
#   report_id        the report it is printed in
#   printed          its number as printed ("Table 4")
#   title            a clean title
#   anchor           text of its title line, matched ignoring case and
#                    punctuation
#   pages            pages it was on at curation; the engine reads these and
#                    two after, and searches the whole report only if the
#                    title has moved
#   measure          what the figures are: gcp, gva_share, gcp_per_capita,
#                    population, ...
#   prices, base_year  for money tables: current or constant, and the
#                    constant prices' base year
#   unit             as printed
#   columns          in order; a year string ("2024*" provisional, "2022+"
#                    revised) or a map with label, period, measure, unit and
#                    sums (false where counties do not add: rates, densities,
#                    per-capita figures, averages of shares are summed)
#   panels           2 where two counties are printed side by side per line
#   trailing_text    true where text printed beside the table runs onto its
#                    lines: a row is then its label and the first run of
#                    figures after it, and words after the figures are
#                    dropped (each row must still carry one figure per column)
#   line_width       characters kept per line, an alternative where a side
#                    text holds figures of its own
#   total_row        false where the table has no total row
#   sum_to           a fixed figure the counties must add to (100 for shares)
#   rounding         the printed precision (1 for whole numbers, 0.1 ...)
#   relabel          printed labels that are not county names, mapped to the
#                    county they mean (a misprint such as "NNYANDARUA")
#   known_gaps       a printed discrepancy between the counties and the total
#                    observed at curation: only that exact gap is accepted
#   blank_cells      cells the report prints blank, found at curation:
#                    geo_code, column, and derive - the columns whose sum the
#                    table's own header identity gives it (C = A + B); the
#                    cell is filled from them and marked "derived"
#   min_rows_on_first_page  rows that must follow the title on its own page
#                    (default 3; 0 where the title ends a page)
#   pins             figures read by hand: geo_code, column, value

