  # Controller of Budget: county budget allocation, expenditure and absorption
  # The same nine columns every year from FY 2015/16: budget and spending,
  # recurrent and development, in KSh million to two decimals, and the three
  # absorption rates (spending as a percent of budget), which do not add.
  - table_id: cob-2015-16-budget
    report_id: cob-2015-16
    printed: "Table 2.4"
    pins:
      - {geo_code: "30", column: "budget_recurrent", value: 3540.88}
      - {geo_code: "47", column: "expenditure_total", value: 23951.02}
      - {geo_code: "00", column: "expenditure_total", value: 295297.45}
    title: "County budget allocation, expenditure and absorption rate, FY 2015/16"
    anchor: "Table 2.4: County budget allocation, expenditure and absorption rate for FY 2015/16"
    pages: [31, 32]
    measure: county_budget
    unit: KSh million
    rounding: 0.01
    # Totals of five digits are set on a lower baseline and come out of the
    # text on the line below their row; the engine reunites them by
    # position (Bungoma, Kakamega, Kiambu, Kilifi, Kitui, Machakos, Mandera,
    # Nakuru, and Nairobi City across three lines).
    columns: &budget_columns
      - {label: budget_recurrent}
      - {label: budget_development}
      - {label: budget_total}
      - {label: expenditure_recurrent}
      - {label: expenditure_development}
      - {label: expenditure_total}
      - {label: absorption_recurrent, unit: percent, sums: false}
      - {label: absorption_development, unit: percent, sums: false}
      - {label: absorption_total, unit: percent, sums: false}
    identities: &budget_identities
      - {column: budget_total, sum: [budget_recurrent, budget_development]}
      - {column: expenditure_total, sum: [expenditure_recurrent, expenditure_development]}
    # Busia's total expenditure is printed as 5,865.76, but D + E = 5,896.98;
    # the printed national total is the sum with 5,896.98.
    misprints:
      - {geo_code: "40", column: expenditure_total}
