url: https://Mustapha-Wasseja.github.io/knbsdata/

template:
  bootstrap: 5

articles:
- title: Articles
  navbar: ~
  contents:
  - getting-started
  - survey-catalogue
  - census-indicators
  - county-data
  - statistical-abstract
  - source-status

reference:
- title: Search
  desc: >
    One search across every catalogue the package reads, each result with
    the call that retrieves it.
  contents:
  - knbs_search

- title: Surveys
  desc: >
    Discovering studies and their documentation. Metadata only: no supported
    source permits programmatic download of microdata.
  contents:
  - knbs_search_surveys
  - knbs_survey_metadata
  - knbs_variables
  - knbs_survey_files
  - knbs_download_microdata

- title: Publications
  desc: >
    Statistical releases, reports and workbooks from the KNBS website, with
    verified, checksummed downloads.
  contents:
  - knbs_publications
  - knbs_download_publication

- title: Statistical Abstract tables
  desc: >
    Curated, validated extraction of the Statistical Abstract's chapter
    workbooks into tidy tables.
  contents:
  - knbs_abstract_tables
  - knbs_abstract_table

- title: Indicators and prices
  desc: >
    Census tables (CC BY 4.0), the monthly consumer price series, and the
    retail prices of the CPI basket commodities.
  contents:
  - knbs_indicators
  - knbs_get_indicator
  - knbs_retail_prices

- title: Geography
  desc: >
    The coded territorial hierarchy of the 2019 census frame — the join keys
    the census tables themselves use — and official county codes for county
    names written any way.
  contents:
  - knbs_geographies
  - knbs_county_code
  - knbs_match_counties

- title: Sources
  desc: >
    What the package knows about each KNBS source, and how far that source has
    been verified.
  contents:
  - knbs_sources
  - knbs_status

- title: Provenance
  desc: >
    Every object the package returns carries where it came from, when it was
    retrieved and how to cite it — and keeps it when written to Excel, CSV,
    Stata or SPSS.
  contents:
  - knbs_metadata
  - knbs_cite
  - knbs_write

- title: Configuration
  desc: Session options controlling caching, timeouts and retries.
  contents:
  - knbs_option
  - knbs_options

- title: Cache
  desc: Inspecting and clearing locally cached responses.
  contents:
  - knbs_cache_dir
  - knbs_cache_info
  - knbs_cache_clear
  - knbs_cache_prune
